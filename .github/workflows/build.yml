name: Build SystemResizer-garnet

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          cd src
          zip -r9 -X ../SystemResizer-garnet.zip META-INF dynamic_partitions_op_list *.dat.br *.patch.dat *.transfer.list
          cd ..
          unzip -l SystemResizer-garnet.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SystemResizer-garnet
          path: SystemResizer-garnet.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SystemResizer-garnet.zip
